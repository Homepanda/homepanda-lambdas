version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install --global yarn@1.22.22
      - node --version
      - yarn --version

  pre_build:
    commands:
      - test -f src/index.mjs
      - test -f src/package.json
      - test -f src/yarn.lock
      - test -f src/helper/comuni.csv

  build:
    commands:
      - mkdir -p dist
      - |
        (
          cd src
          rm -rf node_modules
          yarn install --frozen-lockfile --production=true --non-interactive
          node --check index.mjs
          zip -qr ../dist/immobiliare-ads-handler.zip . \
            -x '*.git*' '*.DS_Store'
        )

  post_build:
    commands:
      - unzip -l dist/immobiliare-ads-handler.zip
      - unzip -Z1 dist/immobiliare-ads-handler.zip | grep -Fx index.mjs
      - unzip -Z1 dist/immobiliare-ads-handler.zip | grep -Fx helper/comuni.csv
      - sha256sum dist/immobiliare-ads-handler.zip

artifacts:
  base-directory: dist
  files:
    - immobiliare-ads-handler.zip