version: 0.2

env:
  variables:
    PLAN: "true"
    DEPLOY_CONFIRMED: "false"

phases:
  install:
    commands:
      - |
        set -eu
        command -v aws
        command -v python3
        command -v sha256sum
        command -v bash
        aws --version

  pre_build:
    commands:
      - |
        set -eu
        unset BUILD_ARTIFACT_DIR
        export BUILD_ARTIFACT_DIR="${CODEBUILD_SRC_DIR_BuildArtifact:-}"
        if [ -z "$BUILD_ARTIFACT_DIR" ]; then
          echo "Input secondario BuildArtifact non trovato." >&2
          echo "Atteso: CODEBUILD_SRC_DIR_BuildArtifact" >&2
          env | sort | grep '^CODEBUILD_SRC_DIR' || true
          exit 1
        fi
        test -d "$CODEBUILD_SRC_DIR"
        test -f "$BUILD_ARTIFACT_DIR/release-manifest.json"
        test -f "$CODEBUILD_SRC_DIR/scripts/deploy-release.sh"

  build:
    commands:
      - |
        set -eu
        bash "$CODEBUILD_SRC_DIR/scripts/deploy-release.sh" "$BUILD_ARTIFACT_DIR"
        test -f "$CODEBUILD_SRC_DIR/deploy-plan.json"

artifacts:
  base-directory: .
  files:
    - deploy-plan.json